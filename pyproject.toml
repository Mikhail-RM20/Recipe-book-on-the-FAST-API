[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myapp"
version = "0.1.0"
description = "My FastAPI app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src", "basic_functionality"]
[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "basic_functionality"]
known_first_party = ["src"]
combine_as_imports = true