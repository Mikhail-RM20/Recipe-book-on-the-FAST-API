[tool.ruff]
src = ["src", "tests", "basic_functionality"]
exclude = [
    ".git",
    ".venv",
    "ruff_cashe",
    "venv", "build",
    "dist",
    "__pycache__"
]
line-length = 79
target-version = "py312"

[lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "W",
    "I",
    "N"
]
fixable = [
    "ALL",
]
unifixable = []

[format]
quote-style = "double"
indent-style = "space"
indent-width = 4
skip-magic-trailing-comma = false
line-ending = 'auto'
docstring-code-format = true
docstring-code-line-length = 79


[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myapp"
version = "0.1.0"
description = "My FastAPI app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
