name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install  black isort flake8 pytest

      - run: pytest tests
      - run: mypy src/ basic_functionality/
      - run: black --diff --check src/ basic_functionality/
      - run: isort --check-only src/ basic_functionality/
      - run: flake8 src/ basic_functionality/
